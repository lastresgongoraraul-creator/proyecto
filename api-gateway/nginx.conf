server {
    listen 80;
    server_name localhost;

    # The resolver IP will be injected dynamically at startup by 99-set-resolver.sh
    resolver RESOLVER_IP valid=30s;

    # Frontend (React/Vite static build)
    location / {
        set $frontend http://frontend-service.internal:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (Spring Boot)
    location /api/ {
        set $backend http://backend-service.internal:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI Service (Python FastAPI)
    location ~ ^/api/v1/ai/(.*)$ {
        set $ai_service http://ai-service.internal:8000/$1$is_args$args;
        proxy_pass $ai_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat Service (Socket.io and related HTTP)
    location /socket.io/ {
        set $chat_service http://chat-service.internal:3001;
        proxy_pass $chat_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
