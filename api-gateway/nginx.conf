server {
    listen 80;
    server_name localhost;

    # The resolver IP will be injected dynamically at startup by 99-set-resolver.sh
    resolver RESOLVER_IP valid=30s;

    # Aquí es donde el Gateway conecta al usuario con el Frontend (React)
    location / {
        set $frontend http://frontend-service.internal:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aquí se enrutan las peticiones REST (/api/) hacia el Backend (Java Spring Boot)
    location /api/ {
        set $backend http://backend-service.internal:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aquí se conectan las peticiones de inteligencia artificial directamente al AI-Service (Python)
    location ~ ^/api/v1/ai/(.*)$ {
        set $ai_service http://ai-service.internal:8000/$1$is_args$args;
        proxy_pass $ai_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aquí se interceptan las conexiones WebSocket en tiempo real para mandarlas al Chat-Service (Node.js)
    location /socket.io/ {
        set $chat_service http://chat-service.internal:3001;
        proxy_pass $chat_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
